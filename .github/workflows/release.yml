name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "codex/release-*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel superseded release runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          gh api "repos/$GH_REPO/actions/runs?branch=$RELEASE_BRANCH&per_page=30" \
            --jq ".workflow_runs[] | select(.path == \".github/workflows/release.yml\" and .id < $GITHUB_RUN_ID and .status != \"completed\") | .id" \
            | while read -r run_id; do
              gh api --method POST "repos/$GH_REPO/actions/runs/$run_id/cancel"
            done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  publish:
    needs: preflight
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run brand:check
      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $package = Get-Content -Raw package.json | ConvertFrom-Json
          $tauri = Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json
          $cargoVersion = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1
          if ($null -eq $cargoVersion) {
            throw "Could not read the Cargo package version."
          }
          $versions = @($package.version, $tauri.version, $cargoVersion.Matches[0].Groups[1].Value)
          if (($versions | Select-Object -Unique).Count -ne 1) {
            throw "package.json, tauri.conf.json, and Cargo.toml versions must match."
          }
          if ($package.version -match '-' -and $package.version -notmatch '^\d+\.\d+\.\d+-\d+$') {
            throw "Pre-release versions must use a numeric identifier so the Windows MSI bundle can be created."
          }
          $expectedTag = "v$($package.version)"
          $expectedRef = if ($env:GITHUB_REF_TYPE -eq 'tag') { $expectedTag } else { "codex/release-$($package.version)" }
          if ($env:GITHUB_REF_NAME -ne $expectedRef) {
            throw "Release ref '$env:GITHUB_REF_NAME' does not match app version '$expectedRef'."
          }
          "tag=$expectedTag" >> $env:GITHUB_OUTPUT
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseName: TokenHalo v__VERSION__
          releaseBody: |
            ## 修复 / Fixes

            - 修复悬停不展开、移开不收起：桌面浮层统一读取实际鼠标位置，遗漏进入或移出事件时也能恢复。
            - 防止网页和原生鼠标事件互相覆盖，并等待窗口缩放完成后再判断鼠标位置。
            - 保留手动收起、设置面板、锁定穿透和测试通知的预期行为。
            - 修复任务胶囊的悬停冲突、残留操作按钮，以及失去窗口焦点后无法自动收起的问题。
            - 恢复后台任务胶囊的位置轮询，补救遗漏的原生鼠标事件。
            - 更新开发依赖，修复发布前安全审计发现的问题。
            - Fixes missed hover events and conflicting DOM/native pointer states in the floating widget and task capsules.
            - Preserves explicit collapse, open settings, click-through locking, notification previews, and active keyboard focus.

            ## 验证 / Verification

            - 347 frontend tests, including 12 new regression cases.
            - TypeScript checks and production frontend build.
            - npm security audit before packaging.
            - Rust tests and macOS Universal / Windows packaging in GitHub Actions.

            ## Download

            - macOS: download the Universal `.dmg`. The unsigned build may require right-clicking TokenHalo and choosing **Open** the first time.
            - Windows: download the `.exe` or `.msi`. The unsigned build may trigger a SmartScreen warning.

            ## Privacy

            TokenHalo reads the local Codex Desktop login state for remaining-quota requests and reads local `~/.codex/sessions` Token counters for on-device statistics. It does not upload prompts, chats, raw session text, local statistics, or credentials.
          releaseDraft: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          args: ${{ matrix.args }}

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Verify installers and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.publish.outputs.release_tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --json assets > release-assets.json
          python3 - "$RELEASE_TAG" <<'PY'
          import json
          import sys
          from pathlib import Path

          version = sys.argv[1].removeprefix("v")
          assets = json.loads(Path("release-assets.json").read_text())["assets"]
          available = {asset["name"] for asset in assets if asset["size"] > 0}
          required = {
              f"TokenHalo_{version}_universal.dmg",
              f"TokenHalo_{version}_x64-setup.exe",
              f"TokenHalo_{version}_x64_en-US.msi",
              "TokenHalo_universal.app.tar.gz",
          }
          missing = required - available
          if missing:
              raise SystemExit(f"Missing release installers: {sorted(missing)}")
          print("All macOS and Windows installers are present.")
          PY
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
