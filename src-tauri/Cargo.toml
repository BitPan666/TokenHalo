[package]
name = "tokenhalo"
version = "0.1.4"
description = "A lightweight floating Codex quota monitor"
authors = ["TokenHalo contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "tokenhalo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
dirs = "6"
iana-time-zone = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tokio = { version = "1", features = ["macros", "sync"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSColor", "NSGlassEffectView", "NSGraphics", "NSResponder", "NSView", "NSVisualEffectView", "objc2-core-foundation", "objc2-quartz-core"] }
objc2-foundation = { version = "0.3.2", features = ["NSGeometry", "NSObject", "NSProcessInfo"] }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6" }
window-vibrancy = "0.8.0"
